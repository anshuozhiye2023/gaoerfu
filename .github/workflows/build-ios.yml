name: build-ios

# 云端 macOS 上把 iOS 壳编译成「未签名 ipa」。
# 未签名 ipa 拿到 Windows 上用 Sideloadly / AltStore 签自己的 Apple ID 就能装；
# 有付费开发者账号后，见 IOS-SIDELOAD.md 的「正式签名」一节再切真签名。

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:      # 手动触发按钮

jobs:
  build:
    # ⚠ 必须是 macos-26（默认 Xcode 26.x）。
    #   Apple 自 2026-04-28 起要求所有上传到 App Store Connect 的包必须由
    #   Xcode 26 + iOS 26 SDK 构建，旧 SDK 的包**自动拒收、无宽限期**。
    #   原来跑 macos-15（默认 Xcode 16.4）出的包，走 TestFlight 会在上传那一步
    #   被直接打回，所以这里跟到底线版本。
    #   注意：macos-14 镜像从 2026-07 起已进入弃用流程，别再往回退。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本（留档排查用）
        run: xcodebuild -version

      - name: 生成 Xcode 工程（XcodeGen）
        env:
          # macOS runner 上 brew 的自动更新+清理比装包本身还慢，关掉省一两分钟
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild -list

      # 守卫三条，都是「编译能过、但到 App Store 那一步才炸」的坑，让它提前在 CI 红：
      #   1. Info.plist 权限键 —— XcodeGen 的 `info:` 段会把手写 plist 覆盖掉，
      #      症状是装真机后蓝牙一调就闪退 / http 离线瓦片源被 ATS 静默拦掉。
      #   2. Xcode 大版本 —— App Store 强制 Xcode 26 + iOS 26 SDK，跑在旧镜像上
      #      出的包会在上传时被自动拒收，不看日志根本想不到是编译机的问题。
      #   3. App 图标 —— 缺 AppIcon 编译完全不报错，只在上传校验时报 ITMS-90022。
      - name: 校验 Info.plist 关键权限键
        run: |
          PLIST=ios/GolfApp/Info.plist
          fail=0
          for k in \
            CFBundleDisplayName \
            NSBluetoothAlwaysUsageDescription \
            NSLocationWhenInUseUsageDescription \
            NSAppTransportSecurity \
            UILaunchScreen \
            UIRequiredDeviceCapabilities \
            ITSAppUsesNonExemptEncryption
          do
            if /usr/libexec/PlistBuddy -c "Print :$k" "$PLIST" >/dev/null 2>&1; then
              echo "✓ $k"
            else
              echo "✗ 缺键: $k  —— 检查 ios/project.yml 是否又启用了 info: 段"
              fail=1
            fi
          done
          exit $fail

      - name: 守卫：Xcode 大版本 ≥ 26（Apple SDK 硬性要求）
        run: |
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          echo "当前 Xcode 大版本: $MAJOR"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::App Store 自 2026-04-28 起只接受 Xcode 26 / iOS 26 SDK 构建的包。"
            echo "::error::请确认 runs-on 仍是 macos-26，或显式 xcode-select 到 Xcode 26。"
            exit 1
          fi

      - name: 守卫：部署目标 ≥ iOS 15（Xcode 26 支持范围下限）
        run: |
          TGT=$(grep -A2 'deploymentTarget' ios/project.yml | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "project.yml 里的 iOS 部署目标: $TGT"
          MINS=$(( ${TGT%%.*} * 100 + ${TGT##*.} ))
          if [ "$MINS" -lt 1500 ]; then
            echo "::error::Xcode 26 支持的最低部署目标是 iOS 15.0，当前是 $TGT。"
            exit 1
          fi

      - name: 守卫：AppIcon 存在（缺了只在 App Store 上传时才报错）
        run: |
          ICONSET=ios/GolfApp/Assets.xcassets/AppIcon.appiconset
          test -f "$ICONSET/Contents.json" || { echo "::error::缺 $ICONSET/Contents.json"; exit 1; }
          N=$(ls "$ICONSET"/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "AppIcon 里找到 $N 张 png"
          test "$N" -ge 1 || { echo "::error::AppIcon 里没有 png（App Store 要求 1024×1024）"; exit 1; }

      # 未签名编译：CODE_SIGNING_ALLOWED=NO 让 CI 上没有证书也能出包。
      # 用 -scheme：XcodeGen 会为 target 自动生成同名 scheme（上面 -list 的
      #   Schemes 段里能看到 GolfApp），这是 Xcode 16 推荐、也是唯一能和
      #   -derivedDataPath 搭配的写法。
      # ⚠ 别退回 `-target GolfApp -derivedDataPath build`：Xcode 15 上能跑，
      #   Xcode 16 起直接报
      #     "The flag -scheme, -testProductsPath, or -xctestrun is required
      #      when specifying -derivedDataPath."
      # 日志用文件接住再按需打印：直接 `| tail -40` 会把真正的 error 行截掉，
      # 只留下末尾一堆无关输出，排查时最气人。
      - name: 编译（Release / 真机 arm64 / 未签名）
        run: |
          cd ios
          if ! xcodebuild -project GolfApp.xcodeproj \
                 -scheme GolfApp -configuration Release \
                 -sdk iphoneos \
                 -derivedDataPath build \
                 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
                 build > build.log 2>&1; then
            echo "❌ 编译失败。以下是全部 error 行："
            grep -nE "error:|fatal error:|cannot find|undefined symbol" build.log | head -50 || true
            echo "----- 日志最后 40 行 -----"
            tail -40 build.log
            exit 1
          fi
          echo "✓ 编译成功"
          tail -5 build.log

      - name: 打包成 ipa
        run: |
          APP=$(find ios/build/Build/Products -type d -name "*.app" | head -1)
          echo "找到 app: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry GolfApp-unsigned.ipa Payload
          # 校验：ipa 就是个 zip，解开必须能看到主二进制和 H5
          unzip -l GolfApp-unsigned.ipa | grep -E "GolfApp$|index.html"
          ls -lh GolfApp-unsigned.ipa

      - name: 校验包内 H5 与仓库一致（防止哪天拷贝断了）
        run: |
          H5_IN_PAYLOAD=$(unzip -p GolfApp-unsigned.ipa "Payload/GolfApp.app/index.html" | shasum -a 256 | cut -d' ' -f1)
          H5_IN_REPO=$(shasum -a 256 ios/GolfApp/index.html | cut -d' ' -f1)
          echo "包内: $H5_IN_PAYLOAD"
          echo "仓库: $H5_IN_REPO"
          test "$H5_IN_PAYLOAD" = "$H5_IN_REPO"

      - uses: actions/upload-artifact@v4
        with:
          # 带上 run 号，多次构建的包不会互相盖掉，下载时能对上是哪一次
          name: GolfApp-unsigned-ipa-${{ github.run_number }}
          path: GolfApp-unsigned.ipa
          retention-days: 30
          # 打包步骤万一静默没产出，这里直接红，避免"绿了但没包"
          if-no-files-found: error
