name: build-ios

# 云端 macOS 上把 iOS 壳编译成「未签名 ipa」。
# 未签名 ipa 拿到 Windows 上用 Sideloadly / AltStore 签自己的 Apple ID 就能装；
# 有付费开发者账号后，见 IOS-SIDELOAD.md 的「正式签名」一节再切真签名。

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:      # 手动触发按钮

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本（留档排查用）
        run: xcodebuild -version

      - name: 生成 Xcode 工程（XcodeGen）
        env:
          # macOS runner 上 brew 的自动更新+清理比装包本身还慢，关掉省一两分钟
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild -list

      # 守卫：XcodeGen 的 `info:` 段语义是「生成 plist」，会把手写的 Info.plist
      # 覆盖成只含 properties 的版本。权限键丢了编译照样通过，只有装到真机
      # 才暴露（蓝牙一调就闪退 / http 离线瓦片源被 ATS 静默拦掉）。
      # 这里显式断言，让回归在 CI 上直接红，而不是到了场地才发现。
      - name: 校验 Info.plist 关键权限键
        run: |
          PLIST=ios/GolfApp/Info.plist
          fail=0
          for k in \
            CFBundleDisplayName \
            NSBluetoothAlwaysUsageDescription \
            NSLocationWhenInUseUsageDescription \
            NSAppTransportSecurity \
            UILaunchScreen \
            UIRequiredDeviceCapabilities
          do
            if /usr/libexec/PlistBuddy -c "Print :$k" "$PLIST" >/dev/null 2>&1; then
              echo "✓ $k"
            else
              echo "✗ 缺键: $k  —— 检查 ios/project.yml 是否又启用了 info: 段"
              fail=1
            fi
          done
          exit $fail

      # 未签名编译：CODE_SIGNING_ALLOWED=NO 让 CI 上没有证书也能出包。
      # 不用 -scheme（XcodeGen 默认不一定生成 scheme），直接 -target 最稳。
      # 注意：Actions 默认 shell 没有 pipefail，不加上「编译失败但管道吃掉退出码」会假绿。
      - name: 编译（Release / 真机 arm64 / 未签名）
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project GolfApp.xcodeproj \
            -target GolfApp -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -40

      - name: 打包成 ipa
        run: |
          APP=$(find ios/build/Build/Products -type d -name "*.app" | head -1)
          echo "找到 app: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry GolfApp-unsigned.ipa Payload
          # 校验：ipa 就是个 zip，解开必须能看到主二进制和 H5
          unzip -l GolfApp-unsigned.ipa | grep -E "GolfApp$|index.html"
          ls -lh GolfApp-unsigned.ipa

      - name: 校验包内 H5 与仓库一致（防止哪天拷贝断了）
        run: |
          H5_IN_PAYLOAD=$(unzip -p GolfApp-unsigned.ipa "Payload/GolfApp.app/index.html" | shasum -a 256 | cut -d' ' -f1)
          H5_IN_REPO=$(shasum -a 256 ios/GolfApp/index.html | cut -d' ' -f1)
          echo "包内: $H5_IN_PAYLOAD"
          echo "仓库: $H5_IN_REPO"
          test "$H5_IN_PAYLOAD" = "$H5_IN_REPO"

      - uses: actions/upload-artifact@v4
        with:
          # 带上 run 号，多次构建的包不会互相盖掉，下载时能对上是哪一次
          name: GolfApp-unsigned-ipa-${{ github.run_number }}
          path: GolfApp-unsigned.ipa
          retention-days: 30
          # 打包步骤万一静默没产出，这里直接红，避免"绿了但没包"
          if-no-files-found: error
