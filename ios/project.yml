# XcodeGen 配置：在 Mac 上执行 `xcodegen generate` 就能生成 GolfApp.xcodeproj。
#
# 为什么用 XcodeGen 而不是直接提交 .xcodeproj：
#   .xcodeproj 是 Xcode 生成的一大坨 pbxproj，手工改极易损坏、合并必冲突。
#   这个 yml 是「唯一事实来源」，改配置改这里，工程文件随时可重新生成。
#
# 装 XcodeGen：brew install xcodegen

name: GolfApp

options:
  bundleIdPrefix: com.golfrobot
  deploymentTarget:
    iOS: "14.0"          # WKWebView + CoreBluetooth 在 14 上足够；想更省事可提到 15
  createIntermediateGroups: true
  generateEmptyDirectories: false

  # 生成的 .xcodeproj 用哪个 Xcode 的工程格式。
  #
  # ⚠ 别删这一行。XcodeGen 的默认值会跟着它自己的版本一路往前涨
  #   （2.46 默认 xcode16_0 → objectVersion 77），而 CI runner 上的 Xcode
  #   未必跟得上，于是报一句很难读的错：
  #     "The project 'GolfApp' cannot be opened because it is in a future
  #      Xcode project file format (77)"
  #   注意它是 **xcodebuild 读工程时才炸**，xcodegen 那一步会显示成功，
  #   第一眼很容易以为是 yml 写错了。
  # 锁在 15.3 格式：Xcode 15.3 到 16.x 都能打开，本地有 Mac 时也不挑。
  projectFormat: xcode15_3

settings:
  base:
    # 换场地/换公司时改这两个
    PRODUCT_BUNDLE_IDENTIFIER: com.golfrobot.pickapp
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 只上 iPhone，横屏不需要（App 里锁了竖屏）
    TARGETED_DEVICE_FAMILY: "1"
    # 自动签名：在 Xcode 里选一次 Team 即可。填了 DEVELOPMENT_TEAM 就能命令行直接打包
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # ← 填你的 Apple 开发者 Team ID（10 位字符）
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  GolfApp:
    type: application
    platform: iOS
    sources:
      # 整个目录进 target：
      #  - *.swift 自动编译
      #  - *.html 自动作为 resource 打进 .app（ViewController 靠 Bundle.main 读它）
      - path: GolfApp
        # 显式排掉 Info.plist：它由下面的 INFOPLIST_FILE 直接引用即可。
        #
        # ⚠ 千万不要改成 XcodeGen 的 `info:` 段。那个键的语义是
        #「在这个路径**生成**一份 plist」，只会写入 properties 里的键，
        #   于是 `xcodegen generate` 会把手写的 NSBluetooth*UsageDescription、
        #   NSAppTransportSecurity、UILaunchScreen 等全部覆盖掉。
        #   症状极具迷惑性：编译照样成功，但装到真机上
        #     · 一调用蓝牙 → 进程直接闪退（缺权限描述是终止，不是弹窗拒绝）
        #     · 用户自填的 http 离线瓦片源 → 被 ATS 静默拦掉，看起来像"源填错了"
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: GolfApp/Info.plist

# 图标：在 Xcode 里把 AppIcon 拖进 Assets.xcassets 即可（需要 1024×1024 那张）。
# 没放图标也能编译和真机调试，只是不支持上架。
